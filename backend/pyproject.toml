[project]
name = "stone"
version = "0.1.0"
description = "Stone: start from what you own, and test whether the news ever mattered."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "quantstats>=0.0.85",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
