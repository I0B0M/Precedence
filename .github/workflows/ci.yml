# Runs the checks CONTRIBUTING.md asks for on every pull request and every push to main:
# the backend's tests against a throwaway Postgres, the engine and briefing mutation check,
# and the frontend's lint, unit tests and production build (saved-data mode, as Netlify builds it).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stone_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Tests
        run: uv run pytest -q
      - name: Mutation check (every line must say "killed")
        run: |
          bash scripts/mutation_check.sh | tee "$RUNNER_TEMP/mutation.txt"
          if grep -q '^SURVIVED' "$RUNNER_TEMP/mutation.txt"; then
            echo "::error::A broken rule passed the tests; see the SURVIVED lines above."
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (saved-data mode, as on Netlify)
        run: npm run build
        env:
          NEXT_PUBLIC_STONE_SAVED: "1"
